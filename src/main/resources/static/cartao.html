<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Cartão de demonstração — VáDeBicicleta</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<a class="pular" href="#conteudo">Ir para o conteúdo</a>
	<header class="topo">
		<a class="marca" href="inicio.html">
			<svg class="icone" viewBox="0 0 64 40" aria-hidden="true">
				<g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
					<circle cx="14" cy="28" r="8"></circle>
					<circle cx="50" cy="28" r="8"></circle>
					<path d="M14 28h16l8-16h10M30 28l8-16M24 12h14M48 12l2 16"></path>
				</g>
			</svg>
			<span>VáDeBicicleta</span>
		</a>
		<input id="abrir-menu" class="abrir-menu" type="checkbox">
		<label for="abrir-menu" class="menu-botao">Menu</label>
		<nav class="nav-principal" aria-label="Principal">
			<a href="inicio.html">Início</a>
			<a href="editar.html">Meu cadastro</a>
			<a href="cartao.html" aria-current="page">Cartão</a>
			<a href="alugar.html">Alugar</a>
			<a href="confirmacoes.html">Confirmações</a>
		</nav>
		<button id="botao-sair" class="botao-sair" type="button">Sair</button>
	</header>
	<main class="conteudo conteudo-estreito" id="conteudo">
		<h1>Cartão de demonstração</h1>
		<p class="simulacao">Simulação local. Não informe um cartão real nem CVV. Nenhuma cobrança externa é feita.</p>
		<div id="cartao-atual" class="cartao-visual vazio">Carregando...</div>
		<p id="mensagem-formulario" class="aviso" role="alert"></p>
		<form id="formulario-cartao" novalidate>
			<fieldset class="escolha">
				<legend>Escolha um cartão fictício</legend>
				<div id="opcoes"></div>
				<p id="erro-referencia" class="erro-campo" role="alert"></p>
			</fieldset>
			<button id="botao-salvar" type="submit">Salvar cartão</button>
		</form>
		<p class="acao-secundaria"><a href="inicio.html">Voltar ao início</a></p>
	</main>
	<script src="comum.js"></script>
	<script src="cartao.js"></script>
</body>
</html>
