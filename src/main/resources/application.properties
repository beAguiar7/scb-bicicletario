spring.application.name=scb

# Porta local 8080. Na Vercel, a variavel PORT precisa valer 8080.
server.port=${PORT:8080}

# H2 em arquivo, na pasta dados da raiz do projeto.
# O arquivo permanece no disco, entao os dados sobrevivem ao reiniciar a aplicacao.
spring.datasource.url=jdbc:h2:file:./dados/scb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria ou atualiza as tabelas a partir das entidades.
spring.jpa.hibernate.ddl-auto=update

# Consultas ficam nos services, nao durante a renderizacao da pagina.
spring.jpa.open-in-view=false

# Console web do H2 desligado. O modulo spring-boot-h2console nao faz parte do projeto.
spring.h2.console.enabled=false

# Foto do documento: no maximo 5 MB. O service aplica a mesma regra.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-http-form-post-size=8MB
server.tomcat.max-swallow-size=8MB

# Sessao em cookie HttpOnly. O JavaScript nao consegue ler o identificador.
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Falhas inesperadas nao devolvem pilha, excecao ou valores enviados.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Taxa ficticia desta etapa. O PDF do trabalho nao definiu o valor.
scb.aluguel.valor=10.00
scb.aluguel.duracao-horas=2

# Log em arquivo. A mensagem traz codigo, local e descricao; o padrao traz data e usuario.
logging.file.name=logs/scb.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} usuario=%X{usuario:-nao-identificado} %-5level [%logger{40}] %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
