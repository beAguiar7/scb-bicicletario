# Perfil de producao. Credenciais vem do ambiente, nao deste arquivo.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# Atualiza o esquema vazio do PostgreSQL. Nao copia o arquivo H2 local.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Sessao no PostgreSQL, com o script oficial do Spring Session.
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.schema=classpath:org/springframework/session/jdbc/schema-postgresql.sql
spring.session.jdbc.continue-on-error=true

# Cookie da sessao em HTTPS. O nome continua JSESSIONID.
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true

# A Vercel encerra o conteiner com SIGTERM. Ha 30 segundos para encerrar.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Log so no console. A Vercel le stdout e stderr.
logging.file.name=
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} usuario=%X{usuario:-nao-identificado} %-5level [%logger{40}] %msg%n
